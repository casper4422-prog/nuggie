<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>🦕 Dino Nuggie Manager</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='16'>🦕</text></svg>">
        <!-- Hide document content until JS declares it's ready -->
        <style>html:not([data-ready="true"]) { visibility: hidden !important; }</style>
        <!-- PWA manifest -->
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#3b82f6">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="DinoNuggies">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="species-grid.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="nuggies.css">
    <link rel="stylesheet" href="trading.css">
    <link rel="stylesheet" href="friends.css">
    <link rel="stylesheet" href="tribes.css">
    <link rel="stylesheet" href="arena.css">
    <link rel="stylesheet" href="notifications.css">
    </head>
    <body>
        <script>
            window.__API_BASE = 'https://nuggie.onrender.com';
            window.showMainApp = window.showMainApp || function() {
                try { console.warn('[SPA] fallback showMainApp invoked'); } catch (e) {}
                try { const landing = document.getElementById('landingPage'); const mainApp = document.getElementById('mainApp'); const appMain = document.getElementById('appMainContent'); if (landing) landing.style.display = 'none'; if (mainApp) mainApp.style.display = ''; if (appMain) appMain.style.display = ''; } catch (e) {}
            };
            document.documentElement.setAttribute('data-ready', 'true');
        </script>
        <!-- Minimal app shell. All JS lives in external files. -->
        <div id="landingPage" class="landing-page" role="main">
            <div class="landing-container">
                <h1 class="landing-title">Dino Nuggie Manager</h1>
                <form id="loginForm">
                    <div class="form-group">
                            <label class="form-label" for="loginEmail">Email or Nickname</label>
                            <input class="form-control" id="loginEmail" type="text" required autocomplete="username" placeholder="you@example.com or nickname">
                        </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <input class="form-control" id="loginPassword" type="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary login-btn">Login</button>
                </form>

                <div class="login-divider"><span>or</span></div>

                <button class="btn-discord" onclick="discordLogin()">
                    <svg width="20" height="20" viewBox="0 0 71 55" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M60.1 4.9A58.6 58.6 0 0045.6.5a.2.2 0 00-.2.1 40.9 40.9 0 00-1.8 3.7 54.1 54.1 0 00-16.3 0 37.2 37.2 0 00-1.9-3.7.2.2 0 00-.2-.1A58.4 58.4 0 0010.6 4.9a.2.2 0 00-.1.1C1.5 18.4-.9 31.5.3 44.5a.2.2 0 00.1.1 58.9 58.9 0 0017.7 9 .2.2 0 00.2-.1 42.1 42.1 0 003.6-5.9.2.2 0 00-.1-.3 38.8 38.8 0 01-5.5-2.6.2.2 0 010-.4l1.1-.8a.2.2 0 01.2 0c11.5 5.3 24 5.3 35.4 0a.2.2 0 01.2 0l1.1.8a.2.2 0 010 .4 36.1 36.1 0 01-5.6 2.6.2.2 0 00-.1.3 47.3 47.3 0 003.6 5.9.2.2 0 00.2.1A58.7 58.7 0 0070.6 44.6a.2.2 0 00.1-.1c1.4-14.9-2.4-27.9-10.5-39.5a.2.2 0 00-.1-.1zM23.7 36.7c-3.5 0-6.4-3.2-6.4-7.2s2.9-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 3.9-2.8 7.2-6.4 7.2zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.5 0 6.4 3.3 6.4 7.2 0 3.9-2.9 7.2-6.4 7.2z"/>
                    </svg>
                    Continue with Discord
                </button>

                <div class="login-link">Don't have an account? <a href="#" id="showRegisterLink">Register</a></div>
                <div id="loginError" class="login-error" role="status" aria-live="polite"></div>
            </div>
        </div>

        <div id="registerPage" class="register-page hidden" aria-hidden="true"></div>
        <div id="mainApp" class="hidden" aria-hidden="true">
            <header class="header">
                <div class="header-content">
                    <div class="header-top">
                        <div class="logo"><div class="logo-icon">🦕</div> DINO NUGGIES</div>
                        <div class="header-actions">
                            <button class="btn btn-secondary nav-btn" id="goToMyProfileBtn" data-page="profile">👤 My Profile</button>
                            <button class="btn btn-secondary nav-btn" id="goToCreaturesBtn" data-page="creatures">🦖 Creatures</button>
                            <button class="btn btn-secondary nav-btn" id="goToMyNuggiesBtn" data-page="nuggies">🍗 My Nuggies</button>
                            <button class="btn btn-secondary nav-btn" id="goToFriendsBtn" data-page="friends">👥 Friends</button>
                            <button class="btn btn-secondary nav-btn" id="goToMessagesBtn" data-page="messages">💬 Messages</button>
                            <button class="btn btn-secondary nav-btn" id="openTribeManagerBtn" data-page="tribe">🛡️ Tribe</button>
                            <button class="btn btn-secondary nav-btn" id="goToTradingBtn" data-page="trading">🔁 Trading</button>
                            <button class="btn btn-secondary nav-btn" id="goToBossPlannerBtn" data-page="boss">👑 Boss Planner</button>
                            <button class="btn btn-secondary nav-btn" id="goToLeaderboardsBtn" data-page="leaderboards">🏆 Leaderboards</button>
                            <button class="btn btn-secondary nav-btn" id="goToNotificationsBtn" data-page="notifications">🔔 Notifications <span class="notification-badge" id="notificationCount"></span></button>
                            <button id="authBtn" class="btn btn-primary">Sign Out</button>
                        </div>
                    </div>
                    <div class="header-subtitle">Ark Creature Management System Brought to You By Casper4422. Grow Your Armies Here!</div>
                    <div class="header-status">Work in Progress, please report any issues or bugs to casper.4422</div>
                </div>
            </header>
            <main id="appMainContent" role="main"></main>
        </div>

    <!-- Creature modals placeholders -->
    <div class="modal" id="creatureModal" aria-hidden="true"></div>
    <div class="modal" id="creatureDetailModal" aria-hidden="true"></div>

    <!-- Load species database and feature modules, then main app logic -->
    <script src="species-database.js"></script>
    <script src="badge-system.js"></script>
    <script src="creatures.js"></script>
    <script src="friends.js"></script>
    <script src="main.js"></script>
    </body>

    </html>
